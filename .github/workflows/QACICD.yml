name: CI/CD Pipeline

on:
  push:
    branches:
      - QA
    paths:
      - 'client/**'
      - 'server/**'
      - '.github/workflows/**'

jobs:

  # ============================================================
  # STAGE 1 — GITLEAKS
  # ============================================================

  gitleaks_scan:
    name: GitLeaks scan
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Run GitLeaks scan
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/repo \
            zricethezav/gitleaks:latest \
            detect \
            --source /repo \
            --report-format json \
            --report-path /repo/gitleaks-report.json \
            --redact \
            --exit-code 0

      - name: Upload GitLeaks report
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: warn


  # ============================================================
  # STAGE 2 — CHECKOV TERRAFORM
  # ============================================================

  checkov_terraform:
    name: Checkov Terraform Scan
    needs: gitleaks_scan
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Checkov
        run: pip install checkov

      - name: Run Checkov Terraform scan
        run: |
          checkov \
            -d . \
            --framework terraform \
            --output json \
            --output-file-path checkov-terraform-report.json \
            || true

      - name: Upload Checkov Terraform report
        uses: actions/upload-artifact@v4
        with:
          name: checkov-terraform-report
          path: checkov-terraform-report.json
          if-no-files-found: warn


  # ============================================================
  # STAGE 2 — CHECKOV KUBERNETES
  # ============================================================

  checkov_kubernetes:
    name: Checkov Kubernetes Scan
    needs: gitleaks_scan
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Checkov
        run: pip install checkov

      - name: Run Checkov Kubernetes scan
        run: |
          checkov \
            -d . \
            --framework kubernetes \
            --output json \
            --output-file-path checkov-kubernetes-report.json \
            || true

      - name: Upload Checkov Kubernetes report
        uses: actions/upload-artifact@v4
        with:
          name: checkov-kubernetes-report
          path: checkov-kubernetes-report.json
          if-no-files-found: warn


  # ============================================================
  # STAGE 2 — CHECKOV DOCKERFILE
  # ============================================================

  checkov_dockerfile:
    name: Checkov Dockerfile Scan
    needs: gitleaks_scan
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Checkov
        run: pip install checkov

      - name: Run Checkov Dockerfile scan
        run: |
          checkov \
            -d . \
            --framework dockerfile \
            --output json \
            --output-file-path checkov-dockerfile-report.json \
            || true

      - name: Upload Checkov Dockerfile report
        uses: actions/upload-artifact@v4
        with:
          name: checkov-dockerfile-report
          path: checkov-dockerfile-report.json
          if-no-files-found: warn


  # ============================================================
  # STAGE 3 — TRIVY CLIENT / FRONTEND
  # ============================================================

  client-trivy-fs:
    name: Client Trivy FS Scan
    needs: gitleaks_scan
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan - JSON
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            aquasec/trivy:0.74.0 \
            fs /repo/client \
            --format json \
            --output /repo/client-trivy-fs-report.json \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 0

      - name: Run Trivy filesystem scan - Table
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            aquasec/trivy:0.74.0 \
            fs /repo/client \
            --format table \
            --output /repo/client-trivy-fs-report.txt \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 0

      - name: Upload Trivy JSON report
        uses: actions/upload-artifact@v4
        with:
          name: client-trivy-fs-json-report
          path: client-trivy-fs-report.json
          if-no-files-found: warn

      - name: Upload Trivy Table report
        uses: actions/upload-artifact@v4
        with:
          name: client-trivy-fs-table-report
          path: client-trivy-fs-report.txt
          if-no-files-found: warn


  # ============================================================
  # STAGE 3 — TRIVY SERVER / BACKEND
  # ============================================================

  server-trivy-fs:
    name: Server Trivy FS Scan
    needs: gitleaks_scan
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan - JSON
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            aquasec/trivy:0.74.0 \
            fs /repo/server \
            --format json \
            --output /repo/server-trivy-fs-report.json \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 0

      - name: Run Trivy filesystem scan - Table
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            aquasec/trivy:0.74.0 \
            fs /repo/server \
            --format table \
            --output /repo/server-trivy-fs-report.txt \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 0

      - name: Upload Trivy JSON report
        uses: actions/upload-artifact@v4
        with:
          name: server-trivy-fs-json-report
          path: server-trivy-fs-report.json
          if-no-files-found: warn

      - name: Upload Trivy Table report
        uses: actions/upload-artifact@v4
        with:
          name: server-trivy-fs-table-report
          path: server-trivy-fs-report.txt
          if-no-files-found: warn


  # ============================================================
  # STAGE 4 — CLIENT LINT
  # ============================================================

  client-lint:
    name: Client Lint

    needs:
      - client-trivy-fs
      - checkov_kubernetes
      - checkov_dockerfile
      - checkov_terraform

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        continue-on-error: true
        run: npm run lint --if-present


  # ============================================================
  # STAGE 4 — SERVER LINT
  # ============================================================

  server-lint:
    name: Server Lint

    needs:
      - server-trivy-fs
      - checkov_kubernetes
      - checkov_dockerfile
      - checkov_terraform

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        continue-on-error: true
        run: npm run lint --if-present


  # ============================================================
  # STAGE 5 — CLIENT UNIT TEST
  # ============================================================

  client-test:
    name: Client Unit Test

    needs: client-lint

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        continue-on-error: true
        run: npm test --if-present


  # ============================================================
  # STAGE 5 — SERVER UNIT TEST
  # ============================================================

  server-test:
    name: Server Unit Test

    needs: server-lint

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        continue-on-error: true
        run: npm test --if-present


  # ============================================================
  # STAGE 6 — SONARQUBE ANALYSIS & QUALITY GATE
  # ============================================================

  sonarqube:
    name: SonarQube Analysis and Quality Gate Check

    needs:
      - client-test
      - server-test

    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------------------------
      # CHECKOUT WITH COMPLETE GIT HISTORY
      # ----------------------------------------------------------

      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ----------------------------------------------------------
      # SONARQUBE CODE ANALYSIS
      # ----------------------------------------------------------

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}


      # ----------------------------------------------------------
      # SONARQUBE QUALITY GATE
      # ----------------------------------------------------------

      - name: SonarQube Quality Gate check
        id: sonarqube-quality-gate-check
        uses: SonarSource/sonarqube-quality-gate-action@master
        with:
          pollingTimeoutSec: 600
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}


      # ----------------------------------------------------------
      # DISPLAY QUALITY GATE STATUS
      # ----------------------------------------------------------

      - name: Show SonarQube Quality Gate Status
        run: |
          echo "SonarQube Quality Gate Status: ${{ steps.sonarqube-quality-gate-check.outputs.quality-gate-status }}"