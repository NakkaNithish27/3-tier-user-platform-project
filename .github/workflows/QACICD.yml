name: CI/CD Pipeline

on:
  push:
    branches:
      - QA
    paths:
      - 'client/**'
      - 'server/**'
      - '.github/workflows/**'

jobs:

  # ============================================================
  # STAGE 1 — GitLeaks
  # ============================================================

  gitleaks_scan:
    name: GitLeaks scan
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Run GitLeaks scan
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/repo \
            zricethezav/gitleaks:latest \
            detect \
            --source /repo \
            --report-format json \
            --report-path /repo/gitleaks-report.json \
            --redact \
            --exit-code 0

      - name: Upload GitLeaks report
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: warn


  # ============================================================
  # STAGE 2 — Checkov Terraform
  # ============================================================

  checkov_terraform:
    name: Checkov Terraform Scan
    needs: gitleaks_scan
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Checkov
        run: pip install checkov

      - name: Run Checkov Terraform scan
        run: |
          checkov \
            -d . \
            --framework terraform \
            --output json \
            --output-file-path checkov-terraform-report.json \
            || true

      - name: Upload Checkov Terraform report
        uses: actions/upload-artifact@v4
        with:
          name: checkov-terraform-report
          path: checkov-terraform-report.json
          if-no-files-found: warn


  # ============================================================
  # STAGE 2 — Checkov Kubernetes
  # ============================================================

  checkov_kubernetes:
    name: Checkov Kubernetes Scan
    needs: gitleaks_scan
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Checkov
        run: pip install checkov

      - name: Run Checkov Kubernetes scan
        run: |
          checkov \
            -d . \
            --framework kubernetes \
            --output json \
            --output-file-path checkov-kubernetes-report.json \
            || true

      - name: Upload Checkov Kubernetes report
        uses: actions/upload-artifact@v4
        with:
          name: checkov-kubernetes-report
          path: checkov-kubernetes-report.json
          if-no-files-found: warn


  # ============================================================
  # STAGE 2 — Checkov Dockerfile
  # ============================================================

  checkov_dockerfile:
    name: Checkov Dockerfile Scan
    needs: gitleaks_scan
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Checkov
        run: pip install checkov

      - name: Run Checkov Dockerfile scan
        run: |
          checkov \
            -d . \
            --framework dockerfile \
            --output json \
            --output-file-path checkov-dockerfile-report.json \
            || true

      - name: Upload Checkov Dockerfile report
        uses: actions/upload-artifact@v4
        with:
          name: checkov-dockerfile-report
          path: checkov-dockerfile-report.json
          if-no-files-found: warn


  # ============================================================
  # STAGE 2 — Trivy Client Filesystem
  # ============================================================

  client-trivy-fs:
    name: Client Trivy Filesystem Scan
    needs: gitleaks_scan
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      # Keep the Trivy installation step from Article 21 here.
      # The article specifies latest version + cache.
      - name: Install Trivy
        uses: aquasecurity/trivy-action@master
        with:
          version: latest
          cache: true

      - name: Verify Trivy installation
        run: |
          trivy --version
          which trivy

      - name: Run Trivy filesystem scan
        run: |
          trivy fs ./client \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --format json \
            --output client-trivy-fs-report.json \
            --exit-code 0

      - name: Run Trivy table scan
        run: |
          trivy fs ./client \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --format table \
            --output client-trivy-fs-report.txt \
            --exit-code 0

      - name: Upload Client Trivy reports
        uses: actions/upload-artifact@v4
        with:
          name: client-trivy-fs-reports
          path: |
            client-trivy-fs-report.json
            client-trivy-fs-report.txt
          if-no-files-found: warn


  # ============================================================
  # STAGE 2 — Trivy Server Filesystem
  # ============================================================

  server-trivy-fs:
    name: Server Trivy Filesystem Scan
    needs: gitleaks_scan
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install Trivy
        uses: aquasecurity/trivy-action@master
        with:
          version: latest
          cache: true

      - name: Verify Trivy installation
        run: |
          trivy --version
          which trivy

      - name: Run Trivy filesystem scan
        run: |
          trivy fs ./server \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --format json \
            --output server-trivy-fs-report.json \
            --exit-code 0

      - name: Run Trivy table scan
        run: |
          trivy fs ./server \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --format table \
            --output server-trivy-fs-report.txt \
            --exit-code 0

      - name: Upload Server Trivy reports
        uses: actions/upload-artifact@v4
        with:
          name: server-trivy-fs-reports
          path: |
            server-trivy-fs-report.json
            server-trivy-fs-report.txt
          if-no-files-found: warn


  # ============================================================
  # STAGE 3 — Client Lint
  # ============================================================

  client-lint:
    name: Client Lint
    needs:
      - client-trivy-fs
      - checkov_kubernetes
      - checkov_dockerfile
      - checkov_terraform

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run client lint
        run: npm run lint --if-present


  # ============================================================
  # STAGE 3 — Server Lint
  # ============================================================

  server-lint:
    name: Server Lint
    needs:
      - server-trivy-fs
      - checkov_kubernetes
      - checkov_dockerfile
      - checkov_terraform

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run server lint
        run: npm run lint --if-present


  # ============================================================
  # STAGE 4 — Client Unit Test
  # ============================================================

  client-test:
    name: Client Unit Test
    needs: client-lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run client tests
        run: npm test --if-present
        continue-on-error: true


  # ============================================================
  # STAGE 4 — Server Unit Test
  # ============================================================

  server-test:
    name: Server Unit Test
    needs: server-lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run server tests
        run: npm test --if-present
        continue-on-error: true


  # ============================================================
  # STAGE 5 — SonarQube
  # ============================================================

  sonarqube:
    name: SonarQube Analysis and Quality Gate Check
    needs:
      - server-test
      - client-test

    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: SonarQube Quality Gate Check
        id: sonarqube-quality-gate-check
        uses: sonarsource/sonarqube-quality-gate-action@master
        continue-on-error: true
        with:
          pollingTimeoutSec: 600
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: Show SonarQube Quality Gate Status
        run: |
          echo "The Quality Gate status is ${{ steps.sonarqube-quality-gate-check.outputs.quality-gate-status }}"


  # ============================================================
  # STAGE 6 — Client Build
  # ============================================================

  client-build:
    name: Client Build
    needs: client-test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build client
        run: npm run build


  # ============================================================
  # STAGE 8 — Docker Build, Push & Image Scan
  # ============================================================

  docker-build-push:
    name: Docker Build and Push

    needs:
      - client-build
      - sonarqube

    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # Docker Hub Login
      # --------------------------------------------------------

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      # --------------------------------------------------------
      # Checkout source code
      # --------------------------------------------------------

      - name: Checkout source code
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # QEMU
      # --------------------------------------------------------

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3


      # --------------------------------------------------------
      # Docker Buildx
      # --------------------------------------------------------

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      # --------------------------------------------------------
      # Build Docker Image
      #
      # Article 26:
      # push: false
      # load: true
      #
      # This keeps the image local on the same runner so that
      # Trivy can scan it before it is pushed.
      # --------------------------------------------------------

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/nodejs-app:${{ github.sha }}
            ${{ vars.DOCKERHUB_USERNAME }}/nodejs-app:latest


      # --------------------------------------------------------
      # Install Trivy
      # --------------------------------------------------------

      - name: Install Trivy
        uses: aquasecurity/trivy-action@master
        with:
          version: latest
          cache: true


      # --------------------------------------------------------
      # Verify Trivy
      # --------------------------------------------------------

      - name: Verify Trivy installation
        run: |
          trivy --version
          which trivy


      # --------------------------------------------------------
      # Trivy Image Scan — JSON
      # --------------------------------------------------------

      - name: Run Trivy image scan - JSON
        run: |
          trivy image \
            --format json \
            --output docker-trivy-image-report.json \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 0 \
            ${{ vars.DOCKERHUB_USERNAME }}/nodejs-app:${{ github.sha }}


      # --------------------------------------------------------
      # Trivy Image Scan — Table
      # --------------------------------------------------------

      - name: Run Trivy image scan - Table
        run: |
          trivy image \
            --format table \
            --output docker-trivy-image-report.txt \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 0 \
            ${{ vars.DOCKERHUB_USERNAME }}/nodejs-app:${{ github.sha }}


      # --------------------------------------------------------
      # Upload Trivy Reports
      # --------------------------------------------------------

      - name: Upload Docker Trivy reports
        uses: actions/upload-artifact@v4
        with:
          name: docker-trivy-image-reports
          path: |
            docker-trivy-image-report.json
            docker-trivy-image-report.txt
          if-no-files-found: warn


      # --------------------------------------------------------
      # Push Docker Image
      #
      # Article 26:
      # push: true
      # image: <username>/nodejs-app
      # tag: commit SHA
      # --------------------------------------------------------

      - name: Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/nodejs-app:${{ github.sha }}
            ${{ vars.DOCKERHUB_USERNAME }}/nodejs-app:latest