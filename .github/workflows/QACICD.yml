name: CI/CD Pipeline

on:
  push:
    branches:
      - QA
    paths:
      - 'client/**'
      - 'server/**'
      - '.github/workflows/**'

jobs:

  # ============================================================
  # STAGE 1 — GITLEAKS
  # ============================================================

  gitleaks_scan:
    name: GitLeaks scan
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Run GitLeaks scan
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/repo \
            zricethezav/gitleaks:latest \
            detect \
            --source /repo \
            --report-format json \
            --report-path /repo/gitleaks-report.json \
            --redact \
            --exit-code 0

      - name: Upload GitLeaks report
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: warn


  # ============================================================
  # STAGE 2 — CHECKOV TERRAFORM
  # ============================================================

  checkov_terraform:
    name: Checkov Terraform Scan
    needs: gitleaks_scan
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Checkov
        run: pip install checkov

      - name: Run Checkov Terraform scan
        run: |
          checkov \
            -d . \
            --framework terraform \
            --output json \
            --output-file-path checkov-terraform-report.json \
            || true

      - name: Upload Checkov Terraform report
        uses: actions/upload-artifact@v4
        with:
          name: checkov-terraform-report
          path: checkov-terraform-report.json
          if-no-files-found: warn


  # ============================================================
  # STAGE 2 — CHECKOV KUBERNETES
  # ============================================================

  checkov_kubernetes:
    name: Checkov Kubernetes Scan
    needs: gitleaks_scan
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Checkov
        run: pip install checkov

      - name: Run Checkov Kubernetes scan
        run: |
          checkov \
            -d . \
            --framework kubernetes \
            --output json \
            --output-file-path checkov-kubernetes-report.json \
            || true

      - name: Upload Checkov Kubernetes report
        uses: actions/upload-artifact@v4
        with:
          name: checkov-kubernetes-report
          path: checkov-kubernetes-report.json
          if-no-files-found: warn


  # ============================================================
  # STAGE 2 — CHECKOV DOCKERFILE
  # ============================================================

  checkov_dockerfile:
    name: Checkov Dockerfile Scan
    needs: gitleaks_scan
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Checkov
        run: pip install checkov

      - name: Run Checkov Dockerfile scan
        run: |
          checkov \
            -d . \
            --framework dockerfile \
            --output json \
            --output-file-path checkov-dockerfile-report.json \
            || true

      - name: Upload Checkov Dockerfile report
        uses: actions/upload-artifact@v4
        with:
          name: checkov-dockerfile-report
          path: checkov-dockerfile-report.json
          if-no-files-found: warn